name: Build Figure 1

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/make_figure1.py"
      - "requirements-figure.txt"
      - "data/eds_addrbal_20260101_t5_bip30fix.csv"
      - "results/baseline_bip30_corrected.csv"
      - ".github/workflows/build_figure1.yml"

jobs:
  build-figure1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-figure.txt

      - name: Generate Figure 1
        run: |
          python scripts/make_figure1.py

      - name: Verify generated files
        run: |
          test -f figures/Figure1_FRL_final.png
          test -f figures/Figure1_FRL_final.pdf
          test -f figures/Figure1_source_data.csv

          echo "===== GENERATED FILES ====="
          ls -lh figures/

          echo
          echo "===== SOURCE DATA HEAD ====="
          head -n 8 figures/Figure1_source_data.csv

      - name: Upload Figure 1 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Figure1-FRL
          path: |
            figures/Figure1_FRL_final.png
            figures/Figure1_FRL_final.pdf
            figures/Figure1_source_data.csv
